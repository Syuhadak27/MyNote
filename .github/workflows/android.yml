name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tentukan versi
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versi build: $VERSION"

      - name: Build APK release (signed)
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }} 2>&1 | tee build.log

      - name: Laporkan error build sebagai anotasi
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "^(e: |.*error:|FAILURE:|Execution failed|> Task .* FAILED|Caused by:|  [A-Za-z].*\.kt:)" build.log | head -120 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Siapkan artefak
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Catatan-${{ steps.ver.outputs.name }}.apk"

      - name: Upload artefak build
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release (otomatis saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
